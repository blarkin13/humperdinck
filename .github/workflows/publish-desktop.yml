name: Publish desktop installers (public distribution repo)

# Manual release only. Normal development pushes and PRs NEVER publish binaries.
on:
  # Register this manual workflow in Actions without accidentally publishing.
  # This push trigger runs only when this YAML changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-desktop.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version in desktop/src-tauri/tauri.conf.json (e.g. 0.1.0)'
        required: true
        type: string
      release_notes:
        description: 'Public release notes'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/native-desktop.yml
    with:
      # Publisher certificates are optional. Unsigned installers are supported
      # until the owner sets up Microsoft/Apple signing credentials.
      signed_updates: true
      production_signing: false
    secrets: inherit

  publish:
    name: Approve and publish binary-only release
    needs: build
    runs-on: ubuntu-latest
    # Configure approval reviewers on the "production" environment.
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ secrets.RELEASES_PUBLISH_TOKEN }}
      VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      TARGET_REPOSITORY: blarkin13/humperdinck-downloads
    steps:
      - uses: actions/checkout@v4
      # A free update (payments locked off in code, no Built-In Humperdinck
      # Voices bundled) publishes on the production approval alone. Anything
      # else still needs both sign-offs below.
      - name: Classify release (free update or commercial)
        id: kind
        shell: bash
        run: |
          set -euo pipefail
          kind="$(python scripts/classify_release.py)"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Release kind: $kind"
      - if: steps.kind.outputs.kind != 'free'
        name: Require independent exact-build P0 commercial launch signoff
        shell: bash
        env:
          P0_RELEASE_APPROVAL_JSON: ${{ secrets.P0_RELEASE_APPROVAL_JSON }}
        run: |
          set -euo pipefail
          test -n "$P0_RELEASE_APPROVAL_JSON" || { echo 'Commercial P0 approval secret missing; publishing blocked'; exit 1; }
          printf '%s' "$P0_RELEASE_APPROVAL_JSON" | python scripts/check-p0-publish-approval.py --manifest - --version "$VERSION" --commit "${{ github.sha }}"
      - if: steps.kind.outputs.kind != 'free'
        name: Require external exact-build commercial redistribution and speaker-rights signoff
        shell: bash
        env:
          RELEASE_RIGHTS_APPROVAL_JSON: ${{ secrets.RELEASE_RIGHTS_APPROVAL_JSON }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_RIGHTS_APPROVAL_JSON" || { echo 'Release rights approval secret missing; public publishing blocked'; exit 1; }
          printf '%s' "$RELEASE_RIGHTS_APPROVAL_JSON" | python scripts/check-release-rights.py --manifest - --version "$VERSION" --commit "${{ github.sha }}"
      - name: Validate release target, version and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected version X.Y.Z"; exit 1; }
          test -n "$GH_TOKEN" || { echo "Create a RELEASES_PUBLISH_TOKEN secret with Contents: write on the public distribution repository"; exit 1; }
          CONFIG_VERSION="$(python -c 'import json;print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')"
          test "$CONFIG_VERSION" = "$VERSION" || { echo "Version mismatch: desktop=$CONFIG_VERSION requested=$VERSION"; exit 1; }
          test "$(gh api "repos/$TARGET_REPOSITORY" --jq '.private')" = "false" || { echo "Distribution repository must be PUBLIC"; exit 1; }
          if gh release view "v$VERSION" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to overwrite published binaries"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: humperdinck-*-package
          path: packages
          merge-multiple: true
      - name: Verify and stage ONLY installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          for kind in exe dmg deb; do
            mapfile -t files < <(find packages -type f -name "*.$kind")
            test "${#files[@]}" -eq 1 || { echo "Expected exactly one .$kind installer, got ${#files[@]}"; exit 1; }
            case "$kind" in
              exe) dest="humperdinck-windows-x64-$VERSION.exe" ;;
              dmg) dest="humperdinck-macos-arm64-$VERSION.dmg" ;;
              deb) dest="humperdinck-linux-x64-$VERSION.deb" ;;
            esac
            test -s "${files[0]}" || { echo "Installer empty"; exit 1; }
            cp -- "${files[0]}" "publish/$dest"
          done
          # Signed updater files are different from macOS DMG/Linux DEB installers.
          mapfile -t win_sigs < <(find packages -type f -name '*.exe.sig')
          mapfile -t mac_tars < <(find packages -type f -name '*.app.tar.gz')
          mapfile -t mac_sigs < <(find packages -type f -name '*.app.tar.gz.sig')
          test "${#win_sigs[@]}" -eq 1 && test "${#mac_tars[@]}" -eq 1 && test "${#mac_sigs[@]}" -eq 1 || { echo 'Missing/duplicate signed updater artifacts'; exit 1; }
          test -s "${win_sigs[0]}" && test -s "${mac_tars[0]}" && test -s "${mac_sigs[0]}"
          cp -- "${win_sigs[0]}" "publish/humperdinck-windows-x64-$VERSION.exe.sig"
          cp -- "${mac_tars[0]}" "publish/humperdinck-macos-arm64-$VERSION.app.tar.gz"
          cp -- "${mac_sigs[0]}" "publish/humperdinck-macos-arm64-$VERSION.app.tar.gz.sig"
          python scripts/make_native_update_manifest.py --version "$VERSION" --output publish/latest.json \
            --windows_x86_64-asset "publish/humperdinck-windows-x64-$VERSION.exe" \
            --windows_x86_64-signature "publish/humperdinck-windows-x64-$VERSION.exe.sig" \
            --darwin_aarch64-asset "publish/humperdinck-macos-arm64-$VERSION.app.tar.gz" \
            --darwin_aarch64-signature "publish/humperdinck-macos-arm64-$VERSION.app.tar.gz.sig"
          python -m json.tool publish/latest.json >/dev/null
          (cd publish && sha256sum *.exe *.dmg *.deb *.app.tar.gz > SHA256SUMS.txt)
          ls -lh publish
      - name: Publish public GitHub Release with binary artifacts only
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<EOF
          $RELEASE_NOTES

          Windows x64, macOS Apple Silicon and Ubuntu/Debian x64 desktop installers.

          Windows and macOS automatic update files have independent cryptographic Tauri signatures.
          These installers are not OS publisher-signed. Windows Smart App Control
          and macOS Gatekeeper may warn or block unsigned apps. A future
          publisher-signed release can be created after signing is configured.
          Linux DEB updates are manual.
          EOF
          gh release create "v$VERSION" publish/* \
            --repo "$TARGET_REPOSITORY" \
            --title "Humperdinck v$VERSION" \
            --notes-file release-notes.txt \
            --latest
