name: Python syntax validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python sources
        run: python -m compileall -q backend scripts tests
      - name: Install API test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Validate Free/Pro API behavior and built-in voice packs
        run: python -m pytest -q tests/test_api.py tests/test_starter_voice_packs.py tests/test_voice_publisher_app.py tests/test_account_client.py tests/test_pro_license.py tests/test_signing_key_backup.py tests/test_complimentary_grants.py tests/test_release_inventory.py tests/test_voice_consent.py tests/test_stage_pro_v2.py tests/test_release_rights.py tests/test_dependency_rights.py tests/test_launch_readiness.py tests/test_privacy_schema.py tests/test_d1_migration_restore_preflight.py tests/test_p0_publish_approval.py tests/test_native_models.py tests/test_qwen_reference_identity.py tests/test_qwen_gpu_selection.py tests/test_narration_limits.py tests/test_narration_cache.py
