name: Python syntax validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python sources
        run: python -m compileall -q backend scripts tests
