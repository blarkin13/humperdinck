name: Verify existing public installer distribution (read-only)

on:
  pull_request:
    paths:
      - 'scripts/verify_distribution_live.py'
      - '.github/workflows/verify-distribution.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_distribution_live.py'
      - '.github/workflows/verify-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-live-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live website and GitHub release feeds
        run: python scripts/verify_distribution_live.py --json
