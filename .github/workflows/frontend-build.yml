name: Frontend build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vite-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        env:
          npm_config_onnxruntime_node_install_cuda: skip
        run: npm install --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - name: Test frontend update-response handling
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build public Cloudflare studio preview
        run: bash scripts/build-public-studio.sh
      - name: Test public desktop release catalog and Worker routes
        run: |
          node --check src/public-releases.js
          node --check src/model-proxy-worker.js
          node --check src/account-auth.js
          node --check src/lemon-test-commerce.js
          node --test tests/lemon-test-commerce.test.mjs
          node --test tests/lemon-test-grants.test.mjs
          node --test tests/lemon-test-refund-ordering-sqlite.test.mjs
          node --test tests/native-model-mirror.test.mjs
          node --test tests/cross-origin-sweep.test.mjs
          node --test tests/session-expiry.test.mjs
          node --test tests/runtime-security.test.mjs
          node --test tests/expired-session-security.test.mjs
          node --test tests/d1-ledger-integrity.test.mjs
          node --test tests/lemon-live-preflight.test.mjs
          node --test tests/lemon-live-fulfillment-plan.test.mjs
          node --test tests/lemon-live-settlement.test.mjs
          node --test tests/lemon-live-intents.test.mjs
          node --test tests/live-commerce-release-gate.test.mjs
          node --test tests/worker-deployment-provenance.test.mjs
          node --test tests/lemon-live-refund.test.mjs
          node --test tests/lemon-live-disputes.test.mjs
          node --test tests/lemon-live-acceptance.test.mjs
          node --test tests/lemon-live-webhook-adapter.test.mjs
          node --test tests/lemon-live-operator-summary.test.mjs
          node --test tests/account-deletion-preflight.test.mjs
          node --test tests/legal-signed-consent.test.mjs
          node --check website/account/account.js
          node --test tests/account-auth.test.mjs
          node --check src/account-dashboard.js
          node --test tests/account-dashboard.test.mjs
          node --test tests/account-privacy.test.mjs
          node --test tests/account-deletion-retention.test.mjs
          node --test tests/account-privacy-ui.test.mjs
          node --test tests/narration_sections.test.mjs
          node --check src/pro-license.js
          node --test tests/pro-license.test.mjs
          node --test tests/limited-json.test.mjs
          node --check website/script.js
          node --test tests/public-releases.test.mjs
          node --test tests/download-mobile-layout.test.mjs
      - name: Validate public website SEO metadata and sitemap
        run: python3 scripts/check-website-seo.py
      - name: Check browser Kokoro worker syntax
        run: node --check frontend/KokoroWorker.js
      - name: Check staged studio assets
        run: |
          test -s website/studio/index.html
          test -s frontend/KokoroWorker.js
          test -s website/studio/wasm/ort-wasm-simd-threaded.jsep.wasm
          test -s website/THIRD_PARTY_NOTICES.txt
          ! grep -q 'hangry-labs' frontend/src.jsx
          ! grep -q 'kokorotts-' website/index.html
          test -d website/studio/assets
          grep -q '/studio/assets/' website/studio/index.html
          test -s website/build.json
          test -s website/_headers
          grep -q 'Cache-Control: no-store' website/_headers
          grep -q 'PUBLIC_VOICES=' frontend/src.jsx
          ! grep -q 'PublicStudio' frontend/src.jsx
