name: Frontend build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vite-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build public Cloudflare studio preview
        run: bash scripts/build-public-studio.sh
      - name: Check browser Kokoro worker syntax
        run: node --check website/kokoro-worker.mjs
      - name: Check staged studio assets
        run: |
          test -s website/studio/index.html
          test -s website/kokoro-worker.mjs
          test -d website/studio/assets
          grep -q '/studio/assets/' website/studio/index.html
