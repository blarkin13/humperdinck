name: Stripe Managed Payments staged acceptance
on:
  pull_request:
  push:
    branches: [main]
jobs:
  stripe-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/stripe-managed-staging-checkout.js
          node --check src/stripe-managed-staging-webhook.js
          node --check tests/stripe-managed-staging.test.mjs
          node --check src/stripe-managed-live-prelaunch.js
          node --check tests/stripe-managed-live-prelaunch.test.mjs
          node --check src/stripe-managed-reversals.js
          node --check tests/stripe-managed-reversals.test.mjs
          node --check tests/pro-license-repurchase-migration.test.mjs
          node --check src/stripe-managed-sandbox-routes.js
          node --check src/stripe-managed-sandbox-refund.js
          node --check tests/stripe-managed-sandbox-routes.test.mjs
          node --check src/stripe-managed-live-routes-unrouted.js
          node --check tests/stripe-live-unrouted.test.mjs
          node --check website/account/account.js
          node --check tests/account-stripe-sandbox-inline.test.mjs
          node --check website/account/account-stripe-20261114.js
          node --check tests/account-stripe-fresh-asset.test.mjs
      - name: Run Stripe and release-gate tests
        run: node --test tests/stripe-managed-staging.test.mjs tests/stripe-managed-live-prelaunch.test.mjs tests/stripe-managed-reversals.test.mjs tests/pro-license-repurchase-migration.test.mjs tests/stripe-managed-sandbox-routes.test.mjs tests/stripe-live-unrouted.test.mjs tests/account-stripe-sandbox-inline.test.mjs tests/account-stripe-fresh-asset.test.mjs tests/live-commerce-release-gate.test.mjs
      - name: Verify isolated Stripe ledger migration
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib
          db=sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys=ON')
          db.executescript('CREATE TABLE auth_users(id TEXT PRIMARY KEY);')
          db.executescript(pathlib.Path('migrations/0012_stripe_managed_staging.sql').read_text())
          tables={row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'commerce_stripe_intents','commerce_stripe_orders','commerce_stripe_webhook_events'} <= tables
          db.executescript(pathlib.Path('migrations/0013_stripe_managed_live_ledger.sql').read_text())
          tables={row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'commerce_stripe_live_intents','commerce_stripe_live_orders','commerce_stripe_live_events'} <= tables
          print('PASS: isolated Stripe test and live migrations compile')
          PY
