name: Unsigned native desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/build_native_sidecar.py'
      - 'scripts/smoke_native_server.py'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/native-desktop.yml'

permissions:
  contents: read

jobs:
  unsigned-native-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 EXE
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: macOS Apple Silicon DMG
            os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - name: Ubuntu x64 DEB
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: Build the existing React UI
        run: |
          npm install --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend

      - name: Install backend packaging dependencies
        run: python -m pip install -r backend/requirements.txt "pyinstaller>=6,<7"

      - name: Compile the bundled localhost server
        run: python scripts/build_native_sidecar.py --target ${{ matrix.target }}

      - name: Smoke-test the server executable
        run: python scripts/smoke_native_server.py --target ${{ matrix.target }}

      - name: Install Tauri CLI
        run: npm install --prefix desktop --no-audit --no-fund

      - name: Generate icons for all platforms
        working-directory: desktop
        run: npx tauri icon ../frontend/public/humperdinck-favicon-512.png

      - name: Package unsigned native app
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Upload test installer (no release/signing)
        uses: actions/upload-artifact@v4
        with:
          name: humperdinck-${{ matrix.target }}-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
