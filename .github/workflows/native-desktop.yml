name: Native desktop builds and signed updater packages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      production_signing:
        type: boolean
        default: false
      signed_updates:
        type: boolean
        default: false
    secrets:
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      HUMPERDINCK_UPDATER_PUBKEY:
        required: false
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/build_native_sidecar.py'
      - 'scripts/prepare_native_voice_pack.py'
      - 'scripts/prepare_native_sound_pack.py'
      - 'scripts/smoke_native_server.py'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/native-desktop.yml'

permissions:
  contents: read

jobs:
  unsigned-native-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 EXE
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: macOS Apple Silicon DMG
            os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - name: Ubuntu x64 DEB
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: Install existing React UI dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Test frontend update-response handling
        working-directory: frontend
        run: npm test

      - name: Build the existing React UI
        working-directory: frontend
        run: npm run build

      - name: Install backend packaging dependencies
        run: python -m pip install -r backend/requirements.txt "pyinstaller>=6,<7" "kokoro-onnx>=0.6,<1" "espeakng-loader" "certifi>=2025.1" "uv>=0.8,<1" "imageio-ffmpeg>=0.5,<1"

      - name: Run native engine routing and Base-cloning regression tests
        run: |
          python -m pip install "pytest>=8,<10" "httpx>=0.27,<1"
          python -m pytest -q tests/test_native_runtime.py tests/test_qwen_mlx_base.py tests/test_native_disk_space.py tests/test_native_updates.py tests/test_native_update_manifest.py tests/test_models.py::test_first_run_setup_persists_across_visits

      - name: Download and verify seven approved Built-In Humperdinck Voices
        run: python scripts/prepare_native_voice_pack.py

      - name: Download and verify nine approved Humperdinck Sound Effects
        run: python scripts/prepare_native_sound_pack.py

      - name: Compile the bundled localhost server
        run: python scripts/build_native_sidecar.py --target ${{ matrix.target }}

      - name: Smoke-test the server executable
        timeout-minutes: 6
        run: python scripts/smoke_native_server.py --target ${{ matrix.target }}

      - name: Generate real Kokoro speech with the frozen Mac worker
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          python -c "from backend.native_models import download_kokoro; download_kokoro()"
          python scripts/smoke_native_kokoro.py --target ${{ matrix.target }}

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Generate icons for all platforms
        working-directory: desktop
        run: npx tauri icon ../frontend/public/humperdinck-favicon-512.png

      - name: Verify Windows icon was generated
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ico = 'desktop/src-tauri/icons/icon.ico'
          if (-not (Test-Path $ico)) { throw "Missing Windows icon: $ico" }
          $data = [System.IO.File]::ReadAllBytes($ico)
          if ($data.Length -lt 1024 -or $data[0] -ne 0 -or $data[1] -ne 0 -or $data[2] -ne 1 -or $data[3] -ne 0) { throw 'Invalid Windows icon resource' }
          Write-Output "Windows icon generated: $($data.Length) bytes"

      # OS vendor code signing is optional; signed Tauri update artifacts use
      # an independent owner-controlled key and do not require paid certificates.
      - name: Validate Tauri update-signing credentials
        if: inputs.signed_updates
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ secrets.HUMPERDINCK_UPDATER_PUBKEY }}
        run: |
          test -n "$UPDATE_PRIVATE_KEY" && test -n "$UPDATE_PUBLIC_KEY" || { echo 'Add Tauri private key and public key GitHub Actions secrets'; exit 1; }

      - name: Prepare Windows publisher signing (optional, separate from updater signatures)
        if: runner.os == 'Windows' && inputs.production_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Windows publisher signing credentials missing' }
          ./scripts/sign-windows.ps1 -CertificateBase64 $env:WINDOWS_CERTIFICATE -CertificatePassword $env:WINDOWS_CERTIFICATE_PASSWORD

      - name: Prepare Apple Developer ID signing (optional)
        if: runner.os == 'macOS' && inputs.production_signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/import-apple-certificate.sh

      - name: Configure signed update artifacts for publication
        if: inputs.signed_updates
        shell: bash
        run: |
          python -c 'import json,pathlib;pathlib.Path("desktop/src-tauri/signing.updater.json").write_text(json.dumps({"bundle":{"createUpdaterArtifacts":True}}))'
      - name: Package native app
        working-directory: desktop
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ inputs.production_signing && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signed_updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signed_updates && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          HUMPERDINCK_UPDATER_PUBKEY: ${{ inputs.signed_updates && secrets.HUMPERDINCK_UPDATER_PUBKEY || '' }}
        run: |
          CONFIG=()
          if [ "$RUNNER_OS" = Windows ] && [ "${{ inputs.production_signing }}" = true ]; then CONFIG+=(--config src-tauri/signing.windows.json); fi
          if [ "${{ inputs.signed_updates }}" = true ]; then CONFIG+=(--config src-tauri/signing.updater.json); fi
          npx tauri build --bundles ${{ matrix.bundle }} "${CONFIG[@]}"
      # The macOS Tauri bundler re-signs externalBin sidecars without preserving
      # the special PyInstaller entitlement. This ad-hoc-only test repack signs
      # the helper itself and then re-signs the outer app, so the distributed
      # DMG contains the executable with the entitlement it needs.
      - name: Preserve signed macOS sidecar entitlements and rebuild DMG
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          DMG="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG" || { echo "DMG missing"; exit 1; }
          ORIGINAL_MOUNT="$RUNNER_TEMP/humperdinck-original-dmg"
          PAYLOAD="$RUNNER_TEMP/humperdinck-resigned-payload"
          ENTITLEMENTS="$PWD/desktop/src-tauri/entitlements.plist"
          mkdir -p "$ORIGINAL_MOUNT" "$PAYLOAD"
          /usr/bin/hdiutil attach -readonly -nobrowse -mountpoint "$ORIGINAL_MOUNT" "$DMG"
          /usr/bin/ditto "$ORIGINAL_MOUNT/Humperdinck.app" "$PAYLOAD/Humperdinck.app"
          if test -L "$ORIGINAL_MOUNT/Applications"; then
            ln -s /Applications "$PAYLOAD/Applications"
          fi
          /usr/bin/hdiutil detach "$ORIGINAL_MOUNT" -quiet
          APP="$PAYLOAD/Humperdinck.app"
          SIGN_ID="${{ inputs.production_signing && secrets.APPLE_SIGNING_IDENTITY || '-' }}"
          /usr/bin/codesign --force --sign "$SIGN_ID" --options runtime --entitlements "$ENTITLEMENTS" "$APP/Contents/MacOS/humperdinck-server"
          /usr/bin/codesign --force --sign "$SIGN_ID" --options runtime --entitlements "$ENTITLEMENTS" "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          PATCHED_DMG="$RUNNER_TEMP/humperdinck-resigned.dmg"
          /usr/bin/hdiutil create -volname "Humperdinck" -srcfolder "$PAYLOAD" -format UDZO "$PATCHED_DMG"
          mv "$PATCHED_DMG" "$DMG"

      # Tauri's initial macOS updater tarball is made before our custom
      # PyInstaller entitlements are restored. Rebuild and re-sign from the
      # exact final app in the DMG, otherwise updates would regress startup.
      - name: Rebuild and sign final macOS updater bundle
        if: runner.os == 'macOS' && inputs.signed_updates
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          MOUNT="$RUNNER_TEMP/final-mac-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          test -d "$MOUNT/Humperdinck.app"
          OUT="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$OUT"
          tar -czf "$OUT" -C "$MOUNT" Humperdinck.app
          npx tauri signer sign "$OUT"
          test -s "$OUT.sig"
      # Pre-bundle smoke tests cannot catch macOS Library Validation when Tauri
      # re-signs the PyInstaller onefile sidecar. Run the signed copy too.
      - name: Verify signed macOS sidecar and embedded Python startup
        if: runner.os == 'macOS'
        timeout-minutes: 6
        run: |
          # Inspect the actual distributed DMG. Tauri may clean up or move
          # the intermediate .app after producing the disk image.
          DMG="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG" || { echo "No macOS DMG was produced"; exit 1; }
          MOUNT="$RUNNER_TEMP/humperdinck-dmg-mount"
          mkdir -p "$MOUNT"
          /usr/bin/hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap '/usr/bin/hdiutil detach "$MOUNT" -quiet || true' EXIT
          APP="$MOUNT/Humperdinck.app"
          test -d "$APP" || { echo "Humperdinck.app missing from DMG"; ls -la "$MOUNT"; exit 1; }
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/codesign --display --entitlements - --xml "$APP/Contents/MacOS/humperdinck-server" > /tmp/humperdinck-entitlements.plist
          /usr/bin/plutil -lint /tmp/humperdinck-entitlements.plist
          python - <<'PY'
          import plistlib
          with open("/tmp/humperdinck-entitlements.plist", "rb") as f:
              entitlements = plistlib.load(f)
          key = "com.apple.security.cs.disable-library-validation"
          print("Signed Python sidecar entitlement:", key, "=", entitlements.get(key))
          assert entitlements.get(key) is True, f"Missing required signed-sidecar entitlement: {entitlements}"
          PY
          python scripts/smoke_native_server.py --target ${{ matrix.target }} --binary "$APP/Contents/MacOS/humperdinck-server"

      - name: Verify Windows production signature
        if: runner.os == 'Windows' && inputs.production_signing
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer found' }
          $sig = Get-AuthenticodeSignature $installer.FullName
          if ($sig.Status -ne 'Valid') { throw "Untrusted Windows installer: $($sig.Status)" }
          Write-Output "Verified Windows publisher: $($sig.SignerCertificate.Subject)"

      - name: Notarize macOS production DMG
        if: runner.os == 'macOS' && inputs.production_signing
        timeout-minutes: 20
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID" && test -n "$APPLE_APP_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo 'Apple notarization credentials required'; exit 1; }
          DMG="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      - name: Verify signed updater outputs
        if: inputs.signed_updates
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              test "$(find desktop/src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe.sig' | wc -l | tr -d ' ')" -eq 1 ;;
            macOS)
              test "$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')" -eq 1 ;;
            Linux) : ;;
          esac
      - name: Upload native installer and signed updater
        uses: actions/upload-artifact@v4
        with:
          name: humperdinck-${{ matrix.target }}-package
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14
