<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open your studio · Humperdinck</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
:root{--bg:#f6f1e9;--card:#fffaf2;--text:#2a211b;--muted:#6d5d4f;--accent:#b5702c;--line:#e3d6c4}
@media (prefers-color-scheme:dark){:root{--bg:#18130f;--card:#231c17;--text:#f3e9da;--muted:#bba893;--accent:#d8964a;--line:#3a2f26}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:16px}
main{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:440px}
h1{margin:0 0 6px;font-size:1.5rem}p{color:var(--muted);line-height:1.5}
a.button,button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;text-decoration:none;cursor:pointer;text-align:left}
a.primary{background:var(--accent);border-color:var(--accent);color:#fff;justify-content:center;font-weight:600}
small{color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:#3cb371;flex:none}
</style>
</head>
<body>
<main>
<h1>Open your studio</h1>
<div id="content"><p>Checking your account…</p></div>
</main>
<script>
const content=document.getElementById('content');
const show=html=>{content.innerHTML=html};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
async function ready(){
 if(!('serviceWorker' in navigator))throw Error('This browser is too old to open your studio.');
 const reg=await navigator.serviceWorker.register('/r/sw.js',{scope:'/r/'});
 const worker=reg.installing||reg.waiting||reg.active;
 if(worker.state!=='activated')await new Promise(done=>worker.addEventListener('statechange',()=>worker.state==='activated'&&done()));
}
async function open(id){
 show('<p>Opening your studio…</p>');
 try{await ready();location.href='/r/'+id+'/'}catch(e){show('<p>'+esc(e.message)+'</p>')}
}
async function load(){
 let r;
 try{r=await fetch('/api/relay/computers',{cache:'no-store',credentials:'same-origin'})}catch{return show('<p>Could not reach Humperdinck. Check your internet connection.</p>')}
 if(r.status===401)return show('<p>Sign in with the same account you use in the Humperdinck app on your computer.</p><a class="button primary" href="/account/?return=/connect/">Sign in</a>');
 const data=await r.json().catch(()=>({}));
 if(!r.ok)return show('<p>'+esc(data.error||'Something went wrong. Try again in a moment.')+'</p>');
 const list=data.computers||[];
 if(!list.length)return show('<p>None of your computers are available right now.</p><p>On your computer: open Humperdinck, click the server icon at the top right and turn on <strong>Use on other devices</strong>. This page updates by itself.</p>'),setTimeout(load,5000);
 if(list.length===1&&!sessionStorage.getItem('stay'))return open(list[0].id);
 show('<p>Choose a computer:</p>'+list.map(c=>'<button type="button" data-id="'+esc(c.id)+'"><span>'+esc(c.name)+'<br><small>Online</small></span><span class="dot"></span></button>').join(''));
 content.querySelectorAll('button').forEach(b=>b.onclick=()=>open(b.dataset.id));
}
load();
</script>
</body>
</html>
