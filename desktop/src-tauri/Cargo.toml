[package]
name = "humperdinck-desktop"
version = "0.1.0"
description = "Humperdinck desktop application"
authors = ["Humperdinck contributors"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
webbrowser = "1"
serde_json = "1"
tauri-plugin-updater = "2"
